<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table>
            <tr>
                <td>
                    <label for="name">Your Name</label>
                </td>
                <td>:</td>
                <td>
                    <input type="text" placeholder="Your Name" id="name" required minlength="3" maxlength="10">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Your Email : </label>
                </td>
                <td>:</td>
                <td>
                    <input type="email" placeholder="Your Email" id="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="url">Your Website</label>
                </td>
                <td>:</td>
                <td>
                    <input type="url" placeholder="Your Website" id="url">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mobile">Your Mobile</label>
                </td>
                <td>:</td>
                <td>
                    <input type="number" placeholder="Mobile Number" id="mobile">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="dob">Date of Birth</label>
                </td>
                <td>:</td>
                <td>
                    <input type="datetime-local" id="dob">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pass">Password</label>
                </td>
                <td>:</td>
                <td>
                    <input type="password" placeholder="Your Password" id="pass">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="pic">Profile Picture</label>
                </td>
                <td>:</td>
                <td>
                    <input type="file" id="pic" accept="image/*">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Gender</label>
                </td>
                <td>:</td>
                <td>
                    <label for="male">
                        <input type="radio" id="male" value="Male" name="gender">Male
                    </label>
                    <label for="female">
                        <input type="radio" id="female" value="Female" name="gender">Female
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Skills</label>
                </td>
                <td>:</td>
                <td>
                    <label for="html">
                        <input type="checkbox" value="HTML" name="skill" id="html">HTML
                    </label>
                    <label for="css">
                        <input type="checkbox" value="CSS" name="skill" id="css">CSS
                    </label>
                    <label for="js">
                        <input type="checkbox" value="JS" name="skill" id="js">JavaScript
                    </label>
                </td>
            </tr>
            <tr>
                <td>

                </td>
                <td></td>
                <td>

                </td>
            </tr>
            <tr>
                <td>
                    <label for="ctr">Your Country</label>
                </td>
                <td>:</td>
                <td>
                    <select name="" id="ctr">
                        <option value="">--Select Country--</option>
                        <option value="Bangladesh">Bangladesh</option>
                        <option value="India">India</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="USA">USA</option>
                        <option value="Uk">Uk</option>
                        <option value="Others">Others</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="cmt">Your Comment</label>
                </td>
                <td>:</td>
                <td>
                    <textarea name="" id="cmt" placeholder="Your Comment" cols="30" rows="6"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td>
                    <input type="hidden" value="Gopon Tottho" name="hiddenText">
                    <input type="image" src="./btn.png" width="100">
                    <input type="reset">
                    <input type="submit">
                </td>
            </tr>
        </table>
    </form>

    <header>
        <figure>
            <img src="" alt="">
        </figure>
        <nav></nav>
    </header>
    <main>
        <aside></aside>
        <section>
            <div>
                <article>
                    <strong></strong>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <address></address>
    </footer>

</body>

</html>
